# Example job for the refactored methylation branch.
# Build the runtime image first:
#   docker build -t lncbookv3-processing:latest .
#
# Then run standalone:
#   cwltool --outdir results/cwl/methylation \
#     cwl/workflows/methylation.cwl \
#     cwl/methylation-job.yml

manifest:
  class: File
  path: scripts/methylation/methylation.example.json

data_root:
  class: Directory
  path: /path/to/data
