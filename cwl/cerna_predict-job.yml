# Example job for the ceRNA target-prediction stage.
# Build the runtime image first:
#   docker build -t lncbookv3-processing:latest .
#
# Then run standalone:
#   cwltool --outdir results/cwl/cerna_predict \
#     cwl/workflows/cerna_predict.cwl \
#     cwl/cerna_predict-job.yml

manifest:
  class: File
  path: scripts/cerna_pipeline/cerna_predict.example.json

data_root:
  class: Directory
  path: /path/to/data
